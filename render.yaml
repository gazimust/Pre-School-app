databases:
  - name: little-sprouts-db
    plan: free
    databaseName: little_sprouts
    user: little_sprouts

services:
  - type: web
    name: little-sprouts-nursery
    env: docker
    plan: starter
    autoDeploy: true
    healthCheckPath: /login
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: little-sprouts-db
          property: connectionString
      - key: NEXTAUTH_URL
        sync: false
      - key: NEXTAUTH_SECRET
        generateValue: true
